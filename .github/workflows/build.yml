name: Build iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
    - name: Repoyu Çek
      uses: actions/checkout@v4

    - name: Xcode İle iOS (.ipa) Paketi Oluştur
      run: |
        mkdir -p Payload
        swift build -c release --triple arm64-apple-ios17.0-simulator
        cp -R .build/arm64-apple-ios17.0-simulator/release/GlassNotes Payload/GlassNotes.app
        zip -r GlassNotes.ipa Payload

    - name: IPA Dosyasını Çıktı Olarak Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: GlassNotes-IPA
        path: GlassNotes.ipa
