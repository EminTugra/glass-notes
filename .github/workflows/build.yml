name: Build iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
    - name: Repoyu Çek
      uses: actions/checkout@v4

    - name: iOS İçin Derle ve Uygulama Paketi Oluştur
      run: |
        # Swift kodunu release modunda iOS cihazlar için derle
        swift build -c release --triple arm64-apple-ios17.0

        # Geçerli bir iOS .app klasör yapısı oluştur
        mkdir -p Payload/GlassNotes.app
        
        # Derlenen çalıştırılabilir dosyayı kopyala
        cp .build/arm64-apple-ios17.0/release/GlassNotes Payload/GlassNotes.app/GlassNotes

        # Minimal bir Info.plist dosyası oluştur (AltStore'un tanıması için şarttır)
        cat <<EOF > Payload/GlassNotes.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>GlassNotes</string>
            <key>CFBundleIdentifier</key>
            <string>com.emintugra.glassnotes</string>
            <key>CFBundleName</key>
            <string>GlassNotes</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>MinimumOSVersion</key>
            <string>17.0</string>
        </dict>
        </plist>
        EOF

        # .ipa olarak sıkıştır
        zip -r GlassNotes.ipa Payload

    - name: IPA Dosyasını Çıktı Olarak Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: GlassNotes-IPA
        path: GlassNotes.ipa
