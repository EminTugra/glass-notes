name: Build iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
    - name: Repoyu Çek
      uses: actions/checkout@v4

    - name: XcodeGen Kur ve Proje Oluştur
      run: |
        brew install xcodegen
        xcodegen generate

    - name: iOS Uygulamasını Derle ve Paketle
      run: |
        xcodebuild archive \
                   -project GlassNotes.xcodeproj \
                   -scheme GlassNotes \
                   -destination "generic/platform=iOS" \
                   -archivePath build/GlassNotes.xcarchive \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO

        mkdir -p Payload
        cp -R build/GlassNotes.xcarchive/Products/Applications/GlassNotes.app Payload/
        zip -r GlassNotes.ipa Payload

    - name: IPA Dosyasını Çıktı Olarak Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: GlassNotes-IPA
        path: GlassNotes.ipa
