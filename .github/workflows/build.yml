name: Build iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
    - name: Repoyu Çek
      uses: actions/checkout@v4

    - name: Xcode İle iOS (.ipa) Derle
      run: |
        xcodebuild build \
                   -scheme GlassNotes \
                   -destination "generic/platform=iOS" \
                   -configuration Release \
                   -derivedDataPath build \
                   CODE_SIGNING_ALLOWED=NO

        mkdir -p Payload
        cp -R build/Build/Products/Release-iphoneos/GlassNotes.app Payload/ 2>/dev/null || cp -R build/Build/Products/Release-iphoneos/GlassNotes Payload/GlassNotes.app
        zip -r GlassNotes.ipa Payload

    - name: IPA Dosyasını Çıktı Olarak Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: GlassNotes-IPA
        path: GlassNotes.ipa
